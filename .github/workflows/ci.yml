name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.32
        env:
          MYSQL_DATABASE: portal_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/portal_test?serverVersion=8.0.32&charset=utf8mb4
      SHELL_VERBOSITY: -1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_mysql
          coverage: none
          tools: composer:v2, phpstan:1, php-cs-fixer:3

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        run: composer phpunit

      # - name: Run PHPStan
      #   run: phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G

      # - name: Run PHP-CS-Fixer
      #   run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

  admin:
    name: Admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build admin
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --run --passWithNoTests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run end-to-end tests
        run: npm run test:e2e
